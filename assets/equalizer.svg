<svg width="800" height="120" viewBox="0 0 800 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#3DDC84;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1E88E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7F52FF;stop-opacity:1" />
    </linearGradient>
  </defs>
  <style>
    .bar { fill: url(#grad); animation: eq 1.2s infinite ease-in-out alternate; }
    .d0 { animation-delay: 0.0s; }
    .d1 { animation-delay: -0.2s; }
    .d2 { animation-delay: -0.4s; }
    .d3 { animation-delay: -0.6s; }
    .d4 { animation-delay: -0.8s; }
    .d5 { animation-delay: -1.0s; }
    .d6 { animation-delay: -1.2s; }
    .d7 { animation-delay: -1.4s; }
    @keyframes eq {
      0% { height: 10px; y: 100px; }
      100% { height: 100px; y: 10px; }
    }
  </style>
  <g transform="translate(140, 0)">
    <rect class="bar d7" x="0" y="50" width="15" height="60" rx="7" />
    <rect class="bar d6" x="25" y="30" width="15" height="80" rx="7" />
    <rect class="bar d5" x="50" y="70" width="15" height="40" rx="7" />
    <rect class="bar d4" x="75" y="10" width="15" height="100" rx="7" />
    <rect class="bar d3" x="100" y="40" width="15" height="70" rx="7" />
    <rect class="bar d2" x="125" y="20" width="15" height="90" rx="7" />
    <rect class="bar d1" x="150" y="60" width="15" height="50" rx="7" />
    <rect class="bar d0" x="175" y="0"  width="15" height="110" rx="7" />
    <rect class="bar d1" x="200" y="20" width="15" height="90" rx="7" />
    <rect class="bar d2" x="225" y="50" width="15" height="60" rx="7" />
    <rect class="bar d0" x="250" y="10" width="15" height="100" rx="7" />
    <rect class="bar d3" x="275" y="30" width="15" height="80" rx="7" />
    <rect class="bar d1" x="300" y="60" width="15" height="50" rx="7" />
    <rect class="bar d0" x="325" y="0"  width="15" height="110" rx="7" />
    <rect class="bar d1" x="350" y="60" width="15" height="50" rx="7" />
    <rect class="bar d2" x="375" y="20" width="15" height="90" rx="7" />
    <rect class="bar d3" x="400" y="40" width="15" height="70" rx="7" />
    <rect class="bar d4" x="425" y="10" width="15" height="100" rx="7" />
    <rect class="bar d5" x="450" y="70" width="15" height="40" rx="7" />
    <rect class="bar d6" x="475" y="30" width="15" height="80" rx="7" />
    <rect class="bar d7" x="500" y="50" width="15" height="60" rx="7" />
  </g>
</svg>