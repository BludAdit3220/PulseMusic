<svg width="150" height="150" viewBox="0 0 150 150" xmlns="http://www.w3.org/2000/svg">
  <style>
    .spin { animation: spin 3s linear infinite; transform-origin: center; }
    .glow { animation: pulse 2s infinite alternate; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    @keyframes pulse { 0% { filter: drop-shadow(0 0 5px #7F52FF); } 100% { filter: drop-shadow(0 0 15px #3DDC84); } }
  </style>
  <g class="spin">
    <circle cx="75" cy="75" r="70" fill="#121212" class="glow"/>
    <circle cx="75" cy="75" r="65" fill="#181818"/>
    <circle cx="75" cy="75" r="60" fill="none" stroke="#252525" stroke-width="1.5"/>
    <circle cx="75" cy="75" r="52" fill="none" stroke="#252525" stroke-width="1"/>
    <circle cx="75" cy="75" r="44" fill="none" stroke="#252525" stroke-width="1"/>
    <circle cx="75" cy="75" r="36" fill="none" stroke="#252525" stroke-width="1"/>
    <circle cx="75" cy="75" r="24" fill="#3DDC84"/>
    <path d="M51,75 A24,24 0 0,1 99,75 Z" fill="#7F52FF"/>
    <circle cx="75" cy="75" r="5" fill="#EEEEEE"/>
    <circle cx="75" cy="75" r="2" fill="#121212"/>
    <path d="M75,5 A70,70 0 0,1 145,75 A70,70 0 0,0 75,15 A70,70 0 0,0 5,75 A70,70 0 0,1 75,5 Z" fill="#ffffff" opacity="0.05"/>
  </g>
</svg>